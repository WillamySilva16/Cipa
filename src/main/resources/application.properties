server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cipa}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Google Sheets (conta de servico, mesmo modelo do Portal de Indicadores)
google.credentials-json=${GOOGLE_CREDENTIALS_JSON:}
# Base de colaboradores (CPF, nome e cargo). Le so as colunas A:H, sem as de salario e banco.
cipa.colaboradores.id=${COLABORADORES_SHEET_ID:1fj1fcLazJ7bU5tODc9MGcA4khvBpTaIqPInTIJSL7jE}
cipa.colaboradores.range=${COLABORADORES_RANGE:COLABORADORES_HCM!A2:H}
# posicao das colunas dentro do intervalo, a partir do 0: A=CPF_AJUSTADO, C=CPF, D=NOME, E=RE, H=CARGO
cipa.colaboradores.col-cpf=${COL_CPF:0}
cipa.colaboradores.col-cpf-alt=${COL_CPF_ALT:2}
cipa.colaboradores.col-nome=${COL_NOME:3}
cipa.colaboradores.col-cargo=${COL_CARGO:7}
cipa.colaboradores.col-re=${COL_RE:4}
cipa.candidatos.id=${CANDIDATOS_SHEET_ID:1s8gO8RjJNGpOdQYds4a9SqlMDFzgk68XoP4GRI1lifU}
cipa.candidatos.range=${CANDIDATOS_RANGE:'P\u00E1gina1'!A2:B}

# Segredos
cipa.pepper=${CPF_PEPPER:troque-este-texto}
cipa.admin-token=${ADMIN_TOKEN:}
# Opcional. Ex.: 2026-12-05T18:00:00-03:00. Depois dessa hora a votacao fecha; antes dela a apuracao fica bloqueada.
cipa.encerra-em=${VOTACAO_ENCERRA_EM:}
